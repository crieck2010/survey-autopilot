[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-autopilot"
version = "0.2.0"
description = "Automatic first-pass aesthetics engine for the surveying/remote-sensing stack (numpy-only, UI-free)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Charles Rieck" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["surveying", "remote-sensing", "visualization", "aesthetics", "automation"]

[project.urls]
Homepage = "https://github.com/crieck2010/survey-autopilot"
Repository = "https://github.com/crieck2010/survey-autopilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
